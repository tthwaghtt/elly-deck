<style>
:root { color-scheme: dark; }
/* 코끼리 플레이어 모양 — 무대(배경 그림이 깔린 요소) 안에 코끼리가 선다.
   무대 요소에 position: relative; overflow: hidden; 이 있어야 한다. */

/* 배경 두 겹 (플레이어가 무대 맨 뒤에 넣는다). 바꿀 때 0.6초 동안 서서히 덮는다 */
.kk-bgs {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.kk-bg {
  position: absolute;
  inset: 0;
  background: center / cover no-repeat;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.kk-bg.on {
  opacity: 1;
}

/* 코끼리 층 구조 (모두 처음부터 따로 그리는 층으로 둔다 → 움직임이 시작될 때 층을 새로 만드느라 화면이 멈추지 않게)
   .kk         무대 가로 전체. 자리 이동은 transform으로만 (left를 바꾸면 매 프레임 레이아웃을 다시 계산한다)
   .kk-actor   코끼리 크기·발끝 맞추기·다가오기(크기 배율)
   .kk-body    톡/뛰기 동작
   .kk-flip    좌우 바꾸기 (동작과 따로 둬서 애니메이션에 변수가 섞이지 않게) */
.kk {
  position: absolute;
  left: 0;
  right: 0;
  bottom: var(--kk-ground, 16%); /* 풀밭 위 발 닿는 높이 */
  transform: translateX(calc(var(--kk-x, 50%) - 50%));
  transition: transform 0.8s cubic-bezier(0.45, 0.05, 0.35, 1);
  will-change: transform;
  pointer-events: none;
}

.kk-actor {
  position: relative;
  width: var(--kk-size, 88%);
  aspect-ratio: 1;
  margin: 0 auto;
  /* 영상 속 발끝이 영상 높이의 88% 지점 → 그 점을 땅에 맞춘다 */
  transform: translateY(12%) scale(var(--kk-s, 1));
  transform-origin: 50% 88%;
  transition: transform 0.5s ease;
  will-change: transform;
}

.kk-body {
  position: absolute;
  inset: 0;
  transform-origin: 50% 88%;
  will-change: transform;
}

.kk-flip {
  position: absolute;
  inset: 0;
  transform: scaleX(var(--kk-flip, 1));
}

/* 영상 요소는 하나뿐이고 늘 보인다 (숨겼다 보이면 브라우저가 다시 그릴 준비를 하느라 멈추거나 비어 보인다) */
.kk video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* 발밑 그림자 (영상에는 그림자가 없다 → 여기서 그린다). 두 겹: 발 바로 밑의 진한 것 + 넓고 옅은 것 */
.kk-shadow {
  position: absolute;
  left: 50%;
  top: 88.5%;
  width: 82%;
  height: 12%;
  transform: translate(-50%, -50%);
  background:
    radial-gradient(closest-side, rgba(38, 52, 12, 0.55), rgba(38, 52, 12, 0) 80%) center / 74% 60% no-repeat,
    radial-gradient(closest-side, rgba(38, 52, 12, 0.28), rgba(38, 52, 12, 0)) center / 100% 100% no-repeat;
  will-change: transform, opacity;
}

/* 상태가 바로 바뀔 때 이음새를 가리는 "톡" */
.kk.kk-pop .kk-body {
  animation: kk-pop 0.26s ease-out;
}

/* 다른 자리로 뛰어 이동 */
.kk.kk-hop .kk-body {
  animation: kk-hop 0.8s ease-in-out;
}

.kk.kk-hop .kk-shadow {
  animation: kk-shadow 0.8s ease-in-out;
}

@keyframes kk-pop {
  0% { transform: scale(1, 1); }
  35% { transform: scale(1.06, 0.93); }
  70% { transform: scale(0.97, 1.04); }
  100% { transform: scale(1, 1); }
}

@keyframes kk-hop {
  0% { transform: translateY(0) scale(1, 1); }
  15% { transform: translateY(0) scale(1.06, 0.92); }
  45% { transform: translateY(-14%) scale(0.97, 1.04); }
  75% { transform: translateY(0) scale(1.05, 0.94); }
  100% { transform: translateY(0) scale(1, 1); }
}

@keyframes kk-shadow {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  45% { transform: translate(-50%, -50%) scale(0.65); opacity: 0.6; }
}

@media (prefers-reduced-motion: reduce) {
  .kk, .kk-actor { transition: none; }
  .kk.kk-pop .kk-body, .kk.kk-hop .kk-body, .kk.kk-hop .kk-shadow { animation: none; }
}

/* 발표 플레이어 모양. 무대(#stage)는 슬라이드 원본 크기 1920 × 1080으로 그리고 창에 맞게 줄인다. */
[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}

body.idle {
  cursor: none;
}

#stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1920px;
  height: 1080px;
  transform-origin: 50% 50%;
  background: #000;
  overflow: hidden;
}

.slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
}

/* 장은 겹침 없이 바로 바뀐다 */
.slide.on {
  opacity: 1;
}

/* 장 전체를 영상으로 바꾼 경우 (cues.js의 video) */
.slidevid {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  display: none;
}

.slidevid.on {
  display: block;
}

/* 데모 녹화 띄우기 */
.vid {
  position: absolute;
  inset: 0;
  z-index: 4;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0s linear 0.25s;
}

.vid.on {
  opacity: 1;
  visibility: visible;
  transition: opacity 0.25s ease;
}

.vid .dim {
  position: absolute;
  inset: 0;
  background: rgba(18, 20, 18, 0.55);
}

.vid figure {
  position: absolute;
  margin: 0;
  border-radius: 24px;
  overflow: hidden;
  background: #111;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
}

.vid video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  background: #111;
}

.vid .ph {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 40px;
  color: #dfe6da;
  font-size: 30px;
  line-height: 1.5;
  text-align: center;
  white-space: pre-line;
  background: repeating-linear-gradient(45deg, #1d211e 0 24px, #232824 24px 48px);
}

.vid figcaption {
  position: absolute;
  left: 24px;
  bottom: 20px;
  padding: 8px 18px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.62);
  color: #fff;
  font-size: 26px;
}

.vid figcaption:empty {
  display: none;
}

/* 오프닝: 검은 나무 무대 → 연기 → 엘리 → 퇴장. 끝나면 통째로 사라진다 */
.opening {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: #000;
  transition: opacity 0.5s ease;
}

.opening.gone {
  opacity: 0;
  pointer-events: none;
}

.op-stage,
.op-vid {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.op-stage {
  opacity: 0;
  transition: opacity 1.4s ease;
}

.op-stage.on {
  opacity: 1;
}

#opStageShadow {
  transition: opacity 0.3s ease;
}

.op-vid {
  opacity: 0;
  transition: opacity 0.3s ease;
}

.op-vid.on {
  opacity: 1;
}

/* 말하는 엘리 (앱과 같은 플레이어 + 립싱크). 그림자는 무대 그림에 이미 있다 */
.op-elly {
  position: absolute;
  overflow: visible;
  opacity: 0;
  transition: opacity 0.3s ease;
  --kk-size: 100%;
  --kk-ground: 0%;
}

.op-elly.on {
  opacity: 1;
}

.op-elly .kk-shadow {
  display: none;
}

.op-sub {
  position: absolute;
  left: 50%;
  bottom: 56px;
  translate: -50% 0;
  max-width: 1400px;
  margin: 0;
  padding: 14px 28px;
  border-radius: 16px;
  background: rgba(0, 0, 0, 0.55);
  color: #fff;
  font-size: 38px;
  line-height: 1.45;
  text-align: center;
  word-break: keep-all;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.op-sub.on {
  opacity: 1;
}

.op-black {
  position: absolute;
  inset: 0;
  background: #000;
  opacity: 0;
  transition: opacity 0.45s ease;
  pointer-events: none;
}

.op-black.on {
  opacity: 1;
}

/* 겉 화면들 */
#black {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #000;
  display: none;
}

#black.on {
  display: block;
}

/* 시작 전: 관객에게는 검은 화면만 보이게 (안내 글자는 아주 어둡게) */
#start {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: end center;
  padding-bottom: 28px;
  background: #000;
  cursor: pointer;
}

#start p {
  margin: 0;
  font-size: 15px;
  color: #6b6b6b;
  transition: color 0.4s ease;
}

/* F로 전체 화면에 들어가면 안내 글자도 거의 사라진다 (관객에게는 검은 화면) */
:fullscreen #start p {
  color: #1c1c1c;
}

#start.gone {
  display: none;
}

#hud {
  position: fixed;
  left: 16px;
  top: 16px;
  z-index: 40;
  display: none;
  max-width: 560px;
  border-radius: 14px;
  padding: 14px 18px;
  background: rgba(10, 12, 10, 0.86);
  color: #f3f1ea;
  font-size: 15px;
  line-height: 1.55;
  white-space: pre-wrap;
}

#hud.on {
  display: block;
}

#hud b {
  color: #fff;
}

#hud .late {
  color: #ff8a7a;
}

/* 마우스를 움직이면 잠깐 나타나는 버튼 (클리커만 쓸 때는 보이지 않는다) */
#ctrl {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 45;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px;
  border-radius: 14px;
  background: rgba(10, 12, 10, 0.72);
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

#ctrl.on {
  opacity: 1;
  pointer-events: auto;
}

#ctrl button {
  border: 0;
  border-radius: 10px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  font: inherit;
  font-size: 15px;
  cursor: pointer;
}

#ctrl button:hover {
  background: rgba(255, 255, 255, 0.24);
}

#ctrl button:focus-visible {
  outline: 2px solid #9fc0a6;
  outline-offset: 2px;
}

#cPos {
  padding: 0 8px;
  color: #cfd6cb;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

</style>

<script>
// 발표 큐. 이 파일만 고치면 된다. 좌표는 슬라이드 원본 크기(1920 × 1080) 기준이다.
//
// 흐름
// 1. 오프닝: 검은 나무 무대에 적막 → 연기와 함께 엘리 등장 → 자기소개와 발표 소개 → 연기 속으로 퇴장
// 2. 1장이 나오는 순간부터 엘리는 없다. 슬라이드만 한 장씩, 클리커(→)를 누르면 바로 다음 장으로 넘어간다 (11/1 도하: 팝업·움직임 없이).
//
// slides[n]
//   img:   제출한 슬라이드 그림 (tools/fetch-slides.sh가 구글 슬라이드에서 다시 받는다)
//   video: 그 장 전체를 영상으로 바꾸고 싶을 때 (선택). 재생이 끝나면 마지막 화면에서 멈춰 기다린다.
//   beats: 클릭할 때마다 하나씩. 다 쓰면 다음 클릭에 다음 장.
//     { video: "경로.mp4", label: "설명" }   데모 녹화를 슬라이드 위에 띄운다 (끝나면 마지막 화면에서 멈춤)
//     { hide: "video" }                     띄운 영상을 내린다
//   note:  발표자 메모. N 키로 여는 발표자 창에만 보인다.
//
// 데모 녹화를 다시 띄우고 싶으면 그 장에 beats: [{ video: "../demo-recordings/파일.mp4", label: "설명" }] 를 넣는다.

window.DECK = {
  size: [1920, 1080],
  timerTarget: 240, // 초. 발표자 창의 시계가 3분 50초부터 빨개진다

  opening: {
    silence: 3, // 초. 검은 무대에서 아무 소리 없이 기다리는 시간
    stage: "opening/stage_empty.png", // 빈 나무 무대
    stageWithShadow: "opening/stage_shadow.png", // 엘리가 앉는 자리에 그림자만 있는 무대 (엘리가 말하는 동안 배경)
    appear: "opening/appear.mp4", // 연기와 함께 등장 (Sume · Seedance 2.5)
    exit: "opening/exit.mp4", // 연기 속으로 퇴장 (appear를 거꾸로 돌린 것)
    elly: [555, 108, 810], // 말하는 동안 엘리 상자 [x, y, 한 변]. appear 마지막 프레임과 같은 자리
    speed: 1.1, // 오프닝 전체 속도 (11/1 도하: 1.1배). 영상은 이 속도로 틀고, 목소리는 같은 속도로 만든 파일을 쓴다
    voice: "opening/voice/intro_fast.mp3", // Sume TTS · Yuna(Kind Unnie) · 음 높임, 1.1배 (원래 속도는 intro.mp3)
    line: "안녕하세요. 저는 엘리예요. 아이들이 부모님한테 못 하는 말을 들어 주는 아기 코끼리예요. 오늘은 대화가 왜 '그냥'에서 멈추는지, 제가 그 대화를 어떻게 다시 잇는지 보여 드릴게요. 그럼 시작할게요!",
    subtitles: false, // true면 대사를 화면 아래에 자막으로도 띄운다 (발표장 소리가 걱정될 때)
    pauseBeforeExit: 0.7, // 초. 말을 마치고 퇴장하기 전 숨 고르기
    auto: true, // true: 말이 끝나면 스스로 퇴장하고 1장으로. false: 말이 끝나면 클릭을 기다린다
  },

  videoBox: [180, 96, 1560, 878], // 데모 녹화를 띄우는 자리 [x, y, 너비, 높이]

  slides: [
    { img: "slides/slide-01.png", note: "표지. 엘리가 퇴장하면 바로 이 장이 나온다." },
    { img: "slides/slide-02.png", note: "문제. “오늘 학교 어땠어?” “그냥.”" },
    { img: "slides/slide-03.png", note: "연결." },
    { img: "slides/slide-04.png", note: "부모 질문." },
    { img: "slides/slide-05.png", note: "아이 대화." },
    { img: "slides/slide-06.png", note: "신뢰와 안전." },
    { img: "slides/slide-07.png", note: "습관과 코인." },
    { img: "slides/slide-08.png", note: "가족 기록. 리포트는 예시 가족 데이터라고 말로 밝힌다." },
    { img: "slides/slide-09.png", note: "시장과 수익. 숫자는 모두 가정이라고 말한다." },
    { img: "slides/slide-10.png", note: "마무리." },
  ],
};

<script>
(() => {
const __kp = (() => {
// 코끼리 플레이어 — 상태 영상 12개를 이은 한 파일(kokkiri.webm / kokkiri.mov)을 영상 요소 하나로 튼다.
//
// 왜 한 파일·한 요소인가 (11/1 프레임 단위 측정으로 확인한 끊김의 원인)
// - 영상 요소 두 개를 숨겼다 보였다 하면, 숨겨 둔 요소는 브라우저가 그리기를 쉬다가 보이는 순간 다시 준비해 수백 ms 멈추고,
//   상태를 빠르게 두 번 바꾸면 앞뒤가 꼬여 보이는 요소의 영상을 갈아 끼워 코끼리가 한 프레임 사라졌다
// - 영상이 끝난 뒤에야 다음 파일을 불러와 이음새마다 83~367ms 멈췄다
// → 요소 하나만 늘 보이게 두고, 파일 안에서 구간만 옮긴다. 옮기는 동안 브라우저는 직전 그림을 계속 보여 준다 (빈 화면 없음)
//
// 규칙

const FPS = 24;
const SIZE = 960; // 영상·기준 자세·캔버스 한 변
const LOG_MAX = 5000; // 프레임 기록 개수 (약 3분)
const HOLD = 2; // 한 입 모양을 최소 몇 프레임 유지하는가 (프레임마다 깜빡이지 않게)
const RELEASE = 2; // 더 작은 입이 몇 프레임 이어져야 닫는가
const MAX_FILL = 2; // ok=0이 이만큼(프레임) 이하로 짧게 끊기면 앞뒤 변환을 이어 채워 그린다
const NO_CAP = 255;
const IDENTITY = [1, 0, 0, 1, 0, 0];
// 말하는 동안 틀 입 다문 구간. 듣기 두 개만 모든 프레임이 깨끗하다.
// idle_2는 코가 말리는 곳(약 24~48, 60~72프레임)을 변환 하나로 못 따라가 입이 코 밑으로 비치고, idle_3은 추적 ok가 42%뿐이다.
// idle_1은 깨끗하지만 눈을 1.5초쯤 감는다 → 필요하면 talkClips로 넣는다
const DEFAULT_TALK = ["listening_1", "listening_2"];

// 소리 크기 문턱 (0~1, 단계 수별). 열 때는 open 이상, 그 단계를 놓는 건 close 아래로 내려갈 때 → 경계에서 떨지 않게
// 3단계: 활짝(m3)은 가끔 나오는 강조가 되게 높게 (타입캐스트 목소리 12문장 기준, 입 벌린 프레임 중 m3 약 27%)
const THRESHOLDS = {
  2: { open: [0.12, 0.35], close: [0.07, 0.25] },
  3: { open: [0.1, 0.35, 0.8], close: [0.06, 0.25, 0.65] },
};

const SETS = {
  real: { track: "data/track.json", mouth: "mouth/", mask: "data/trunk_mask.png" },
  stub: { track: "stub/track.json", mouth: "stub/", mask: "stub/trunk_mask.png" },
};

/** 변환이 말이 되는가 (크기 0.5~2배, 화면 안). 추적이 튄 프레임에 커다란 입이 그려지지 않게 */
const sane = (m) => {
  if (!Array.isArray(m) || m.length < 6 || !m.every(Number.isFinite)) return false;
  const det = m[0] * m[3] - m[1] * m[2];
  return det > 0.25 && det < 4 && Math.abs(m[4]) < SIZE && Math.abs(m[5]) < SIZE;
};
const lerp6 = (p, q, u) => p.map((v, k) => v + (q[k] - v) * u);

const canvas2d = (w = SIZE, h = SIZE, opts) => {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  return [c, c.getContext("2d", opts)];
};
/** 픽셀을 읽느라 CPU에 둔 캔버스를 매 프레임 그리기 좋은 보통 캔버스로 옮긴다 */
const copyCanvas = (src) => {
  const [c, g] = canvas2d(src.width, src.height);
  g.drawImage(src, 0, 0);
  return c;
};

class KokkiriLipSync {
  /**
   * @param kk KokkiriPlayer
   * @param opts.base 데이터 폴더 (data/, mouth/, stub/이 들어 있는 곳)
   * @param opts.talkClips 말하는 동안 틀 입 다문 구간들
   * @param opts.getLevel () => 지금 목소리 크기 0~1
   * @param opts.dataSet "auto"(진짜 먼저, 없으면 stub) | "real" | "stub"
   * @param opts.thresholds { open: [...], close: [...] } 단계 수만큼 (기본 THRESHOLDS)
   * @param opts.maskDilate 코 마스크를 몇 px 넓힐지 (0~1. 넓히면 입과 코 사이에 피부 틈이 보인다)
   * @param opts.maskFeather 코 마스크 가장자리 흐림 px
   */
  constructor(kk, { base = "./", talkClips = DEFAULT_TALK, getLevel = () => 0, dataSet = "auto", thresholds, maskDilate = 0, maskFeather = 1 } = {}) {
    this.kk = kk;
    this.video = kk.video;
    this.base = base.endsWith("/") ? base : base + "/";
    this.talk = talkClips.filter((n) => SEGMENTS[n]);
    this.original = [...CLIPS.speaking];
    this.baked = new Set(this.original.filter((n) => !this.talk.includes(n))); // 입이 움직이는 원래 말하기 구간 — 그 위엔 입을 안 그린다 (기준 자세인 0프레임만 빼고)
    this.getLevel = getLevel;
    this.dataSet = dataSet;
    this.userThresholds = thresholds;
    this.maskDilate = Math.min(1, Math.max(0, maskDilate | 0));
    this.maskFeather = Math.max(0, maskFeather | 0);

    this.supported = null; // null = 아직 모름 (첫 프레임을 그려 봐야 안다)
    this.reason = "";
    this.enabled = true; // 켜고 끄기 (비교용)
    this.active = false; // 지금 캔버스가 보이고 영상이 숨은 상태
    this.started = false; // 소리가 나는 중
    this.levelMode = true; // 이번 말에 소리 크기가 있는가
    this.assetsReady = false;
    this.clipsTouched = false;
    this.mouth = 0; // 소리로 정한 입 단계 (문턱·유지 규칙)
    this.held = HOLD;
    this.lowHist = [];
    this.vis = 0; // 실제로 그린 입 단계 (ok 끊김 앞뒤에서 한 단계씩 줄이고 늘린다)
    this.rising = false;
    this.probeTries = 0;
    this.levels = 0; // 입 모양 단계 수 (2 또는 3)
    this.sources = {};
    this.log = [];
    this.last = null;
    this.stats = { frames: 0, drawn: 0, insane: 0, filled: 0 };
    // 구간을 프레임 번호로 (구간 시작은 늘 정수 프레임)
    this.segList = Object.entries(SEGMENTS)
      .map(([name, s]) => ({ name, f0: Math.round(s.start * FPS), n: Math.round(s.sec * FPS) }))
      .sort((a, b) => a.f0 - b.f0);

    const [c, ctx] = canvas2d();
    c.className = "kk-lipsync";
    Object.assign(c.style, { position: "absolute", inset: "0", width: "100%", height: "100%", opacity: "0", pointerEvents: "none" });
    this.video.after(c);
    this.canvas = c;
    this.ctx = ctx;
    [this.off, this.offCtx] = canvas2d(16, 16); // 입 둘레만큼만 쓰는 작업 캔버스 (필요하면 커진다)
    this.videoOpacity = this.video.style.opacity;

    if (!("requestVideoFrameCallback" in HTMLVideoElement.prototype)) {
      this.disable("no-rvfc");
      this.loaded = Promise.resolve();
      return;
    }
    this.cb = (now, meta) => this.onFrame(now, meta);
    this.req = this.video.requestVideoFrameCallback(this.cb);
    this.loaded = this.load().catch((e) => this.disable(`assets: ${e.message}`));
  }

  // ---------- 데이터 ----------

  async load() {
    const order = this.dataSet === "auto" ? ["real", "stub"] : [this.dataSet];
    const get = async (path, parse) => {
      try {
        const res = await fetch(this.base + path, { cache: "no-cache" });
        return res.ok ? await parse(res) : null;
      } catch (e) {
        console.warn(`[lipsync] ${path}: ${e.message}`);
        return null;
      }
    };
    const first = async (key, parse) => {
      for (const set of order) {
        const value = await get(SETS[set][key], parse);
        if (value) return { value, set, path: SETS[set][key] };
      }
      return null;
    };
    const bitmap = async (res, raw) =>
      createImageBitmap(await res.blob(), raw ? { colorSpaceConversion: "none", premultiplyAlpha: "none" } : {});
    const json = async (res) => {
      const t = await res.json();
      if (!t || typeof t.segments !== "object") throw new Error("segments 없음");
      return t;
    };
    // 입은 한 곳(진짜 또는 stub)에서 m1부터 이어진 것까지 (m1·m2는 꼭, m3은 있으면)
    const mouths = async () => {
      for (const set of order) {
        const got = [];
        for (const k of [1, 2, 3]) {
          const path = `${SETS[set].mouth}m${k}.png`;
          const value = await get(path, (r) => bitmap(r));
          if (!value) break;
          got.push({ value, set, path });
        }
        if (got.length >= 2) return got;
      }
      return [];
    };
    const [track, mask, sprites] = await Promise.all([first("track", json), first("mask", (r) => bitmap(r, true)), mouths()]);
    if (!track || !mask || sprites.length < 2) throw new Error("track·mask·m1·m2 중 없는 것이 있음");
    const set = sprites[0].set;
    if (track.value.size && track.value.size !== SIZE) console.warn(`[lipsync] track.size ${track.value.size} ≠ ${SIZE}`);

    this.track = track.value;
    this.levels = sprites.length;
    this.prepTrack();
    const th = this.userThresholds ?? THRESHOLDS[this.levels];
    this.openTh = th.open.slice(0, this.levels);
    this.closeTh = th.close.slice(0, this.levels);
    this.sprites = [null, ...sprites.map((m) => this.prepSprite(m.value))];
    this.box = this.sprites.slice(1).reduce((u, s) => ({
      x0: Math.min(u.x0, s.box.x0), y0: Math.min(u.y0, s.box.y0), x1: Math.max(u.x1, s.box.x1), y1: Math.max(u.y1, s.box.y1),
    }), { x0: SIZE, y0: SIZE, x1: 0, y1: 0 });
    this.mask = this.prepMask(mask.value);
    this.sources = { track: track.path, mouth: sprites.map((m) => m.path).join(" "), mask: mask.path, levels: this.levels };
    const sets = new Set([track.set, mask.set, set]);
    this.sources.set = sets.size === 1 ? [...sets][0] : "mixed";
    this.assetsReady = true;
  }

  /**
   * 플레이어의 모든 구간에 대해 프레임별 변환·그려도 되는가(can)·끊김까지 남은 프레임(cap)을 미리 정한다.
   * 1. ok=1이고 변환이 말이 되는 프레임을 쓴다
   * 2. 모든 구간의 0프레임은 똑같은 기준 자세다 → 항등 변환, ok=1 (구간을 옮기는 사이 보이는 이음새 프레임에서도 입이 안 사라지게)
   * 3. 1~2프레임짜리 짧은 끊김은 앞뒤 ok 프레임의 변환을 선형으로 이어 채운다 (구간 끝의 끊김은 다음에 보일 기준 자세 = 항등으로 잇는다)
   * 4. 그래도 남은 끊김 사이에 혼자 있는 한 프레임은 그리지 않는다 (0프레임은 늘 그림)
   * 5. 원래 말하기 구간(입이 움직이는 영상)은 0프레임만
   * cap: 다음 끊김까지 남은 프레임 수 (끊김 바로 앞 1, 그 앞 2 …). 입은 이 값보다 크게 그리지 않는다 → 끊김 앞에서 한 단계씩 줄어든다
   *      0프레임은 다음에 어디가 보일지 모르니(이음새) 제한하지 않는다
   */
  prepTrack() {
    this.frames = {};
    this.stats.insane = 0;
    this.stats.filled = 0;
    for (const { name, n } of this.segList) {
      const t = this.track.segments[name];
      const head = new Array(n).fill(null);
      const trunk = new Array(n).fill(null);
      const okRaw = new Int8Array(n).fill(-1); // -1 = 데이터 없음
      const raw = new Uint8Array(n);
      if (t && Array.isArray(t.head) && Array.isArray(t.trunk)) {
        const m = Math.min(n, t.head.length, t.trunk.length);
        for (let k = 0; k < m; k++) {
          const ok = Array.isArray(t.ok) ? (t.ok[k] ? 1 : 0) : 1;
          const fine = sane(t.head[k]) && sane(t.trunk[k]);
          okRaw[k] = ok;
          if (ok && !fine) this.stats.insane++;
          if (ok && fine) {
            raw[k] = 1;
            head[k] = t.head[k];
            trunk[k] = t.trunk[k];
          }
        }
      }
      raw[0] = 1;
      head[0] = IDENTITY;
      trunk[0] = IDENTITY;
      for (let k = 1; k < n; ) {
        if (raw[k]) {
          k++;
          continue;
        }
        let e = k;
        while (e < n && !raw[e]) e++; // 끊김 [k, e). 앞 프레임 k-1은 늘 ok
        if (e - k <= MAX_FILL) {
          const L = k - 1;
          const rh = e < n ? head[e] : IDENTITY;
          const rt = e < n ? trunk[e] : IDENTITY;
          for (let j = k; j < e; j++) {
            const u = (j - L) / (e - L);
            // 추적기 값이 멀쩡하면 그대로 쓴다: 짧은 끊김은 기준을 아슬아슬하게 못 넘은 프레임이라
            // 직선 보간(검증 2.2~5.7px 어긋남)보다 원래 값(1.1~2.1px)이 정확하다
            const own = t && sane(t.head?.[j]) && sane(t.trunk?.[j]);
            head[j] = own ? t.head[j] : lerp6(head[L], rh, u);
            trunk[j] = own ? t.trunk[j] : lerp6(trunk[L], rt, u);
            raw[j] = 1;
            this.stats.filled++;
          }
        }
        k = e;
      }
      const can = raw.map((v, k) => (v && (k === 0 || raw[k - 1] || (k + 1 < n && raw[k + 1])) ? 1 : 0));
      if (this.baked.has(name)) can.fill(0, 1);
      const cap = new Uint8Array(n);
      let gap = Infinity;
      for (let k = n - 1; k >= 0; k--) {
        if (!can[k]) gap = k;
        else cap[k] = k === 0 ? NO_CAP : Math.min(NO_CAP, gap - k);
      }
      this.frames[name] = { head, trunk, okRaw, can, cap };
    }
  }

  /** 입 조각을 960 캔버스로 맞추고, 그림이 있는 범위(여백 2px)를 잰다 */
  prepSprite(img) {
    const [c, g] = canvas2d(SIZE, SIZE, { willReadFrequently: true });
    g.drawImage(img, 0, 0, SIZE, SIZE);
    const d = g.getImageData(0, 0, SIZE, SIZE).data;
    let x0 = SIZE, y0 = SIZE, x1 = -1, y1 = -1;
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        if (d[(y * SIZE + x) * 4 + 3]) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
      }
    }
    if (x1 < 0) return { img: copyCanvas(c), box: { x0: 0, y0: 0, x1: 1, y1: 1 } };
    return { img: copyCanvas(c), box: { x0: Math.max(0, x0 - 2), y0: Math.max(0, y0 - 2), x1: Math.min(SIZE, x1 + 3), y1: Math.min(SIZE, y1 + 3) } };
  }

  /** 회색조 코 마스크 → 알파 마스크 (넓히기 0~1px, 가장자리 흐림) */
  prepMask(img) {
    const [c, g] = canvas2d(SIZE, SIZE, { willReadFrequently: true });
    g.drawImage(img, 0, 0, SIZE, SIZE);
    const id = g.getImageData(0, 0, SIZE, SIZE);
    const d = id.data;
    let m = new Uint8ClampedArray(SIZE * SIZE);
    for (let p = 0; p < m.length; p++) m[p] = (d[p * 4] * d[p * 4 + 3]) / 255; // 회색 PNG도, 투명 배경 흰 PNG도 받게
    const pass = (src, r, op) => {
      // 가로·세로로 나눠 하는 최댓값(넓히기) 또는 평균(흐림)
      let a = src;
      for (const horiz of [true, false]) {
        const out = new Uint8ClampedArray(a.length);
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            let acc = 0;
            for (let k = -r; k <= r; k++) {
              const xx = horiz ? Math.min(SIZE - 1, Math.max(0, x + k)) : x;
              const yy = horiz ? y : Math.min(SIZE - 1, Math.max(0, y + k));
              const v = a[yy * SIZE + xx];
              acc = op === "max" ? Math.max(acc, v) : acc + v;
            }
            out[y * SIZE + x] = op === "max" ? acc : acc / (2 * r + 1);
          }
        }
        a = out;
      }
      return a;
    };
    if (this.maskDilate) m = pass(m, this.maskDilate, "max");
    if (this.maskFeather) m = pass(m, this.maskFeather, "mean");
    for (let p = 0; p < m.length; p++) {
      d[p * 4] = d[p * 4 + 1] = d[p * 4 + 2] = 0;
      d[p * 4 + 3] = m[p];
    }
    g.putImageData(id, 0, 0);
    return copyCanvas(c);
  }

  // ---------- 프레임마다 ----------

  /** 화면에 나온 프레임의 재생 위치 → (구간, 구간 안 프레임 번호) */
  frameAt(mediaTime) {
    const g = Math.round(mediaTime * FPS);
    for (const s of this.segList) if (g >= s.f0 && g < s.f0 + s.n) return { seg: s.name, i: g - s.f0 };
    const s = g < this.segList[0].f0 ? this.segList[0] : this.segList[this.segList.length - 1];
    return { seg: s.name, i: Math.min(s.n - 1, Math.max(0, g - s.f0)) };
  }

  /** 그 프레임의 변환·그려도 되는가(can)·끊김까지 남은 프레임(cap)·추적 원래 ok(okRaw, -1 = 데이터 없음) */
  frameData(seg, i) {
    const f = this.frames?.[seg];
    if (!f || i < 0 || i >= f.can.length) return null;
    return { head: f.head[i], trunk: f.trunk[i], can: f.can[i], cap: f.cap[i], okRaw: f.okRaw[i] };
  }

  onFrame(now, meta) {
    if (this.dead || this.supported === false) return;
    this.req = this.video.requestVideoFrameCallback(this.cb);
    const want = this.enabled && this.assetsReady && this.supported === true;
    const paint = this.supported === null || this.active || want;
    if (paint) {
      this.ctx.clearRect(0, 0, SIZE, SIZE);
      this.ctx.drawImage(this.video, 0, 0, SIZE, SIZE);
      if (this.supported === null && !this.probe()) return; // 아직 판단 못 함(다음 프레임에) 또는 지원 안 됨
    }
    const { seg, i } = this.frameAt(meta.mediaTime);
    const fd = this.frameData(seg, i);
    const kkState = this.kk.state;
    const level = this.getLevel();
    const allowed = this.active && this.started && this.levelMode && kkState === "speaking";
    const mouth = this.step(allowed, level);
    const can = fd ? fd.can : 0;
    const { vis, ramp } = this.visible(allowed, mouth, can, fd ? fd.cap : 0);
    const drawn = vis > 0 && this.drawPatch(this.sprites[vis], fd.head, fd.trunk);
    if (want !== this.active && paint) this.setActive(want); // 이 프레임을 캔버스에 다 그린 뒤에 바꾼다 → 빈 프레임 없음
    this.stats.frames++;
    if (drawn) this.stats.drawn++;
    const e = {
      mediaTime: meta.mediaTime,
      presentedFrames: meta.presentedFrames,
      expectedDisplayTime: meta.expectedDisplayTime,
      now,
      seg,
      i,
      kkState,
      level: Math.round(level * 1000) / 1000,
      mouth, // 소리로 정한 단계
      vis: drawn ? vis : 0, // 실제로 그린 단계 (m1~m3, 0 = 안 그림)
      ok: can, // 그려도 되는 프레임 (짧은 끊김 채움·0프레임 포함)
      okRaw: fd ? fd.okRaw : -1, // track.json의 ok 그대로
      drawn,
      ramp,
      started: this.started,
      levelMode: this.levelMode,
      active: this.active,
      rate: this.video.playbackRate,
    };
    this.last = e;
    this.log.push(e);
    if (this.log.length > LOG_MAX + 500) this.log.splice(0, this.log.length - LOG_MAX);
  }

  /**
   * 첫 프레임을 그린 뒤: 모서리는 투명해야 하고 몸통 가운데는 그림이 있어야 한다.

  hud.innerHTML = `<b>${si + 1} / ${D.slides.length}장</b> · 클릭 ${bi}/${beats.length} · ${clock}\n다음: ${nextTxt}\n${s.note ? `메모: ${s.note}` : ""}`;
}
setInterval(drawHud, 500);

/* ---------- 마우스를 움직이면 나타나는 버튼 ---------- */
let idleTimer = null;
function updateCtrl() {
  $("#cPos").textContent = opPhase === "done" ? `${si + 1} / ${D.slides.length}` : "오프닝";
  const v = visibleVideo();
  $("#cPause").textContent = v && v.paused ? "▶ 재생" : "❚❚ 일시정지";
  $("#cPause").disabled = !v;
}
function wake() {
  document.body.classList.remove("idle");
  if (started) ctrl.classList.add("on");
  updateCtrl();
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    ctrl.classList.remove("on");
    document.body.classList.add("idle");
  }, 2500);
}
addEventListener("mousemove", wake);
$("#cPrev").addEventListener("click", prev);
$("#cNext").addEventListener("click", next);
$("#cPause").addEventListener("click", togglePause);
[vid, slideVid].forEach((v) => ["play", "pause", "ended"].forEach((e) => v.addEventListener(e, updateCtrl)));

/* ---------- 키 ---------- */
addEventListener("keydown", (e) => {
  const k = e.key;
  if (!started && !["f", "F", "n", "N"].includes(k)) {
    e.preventDefault();
    start();
    return;
  }
  switch (k) {
    case "ArrowRight":
    case "ArrowDown":
    case "PageDown":
    case "Enter":
      e.preventDefault();
      next();
      break;
    case " ":
      e.preventDefault();
      if (!togglePause()) next(); // 영상이 보이면 일시정지/재생, 아니면 다음
      break;
    case "ArrowLeft":
    case "ArrowUp":
    case "PageUp":
    case "Backspace":
      e.preventDefault();
      prev();
      break;
    case "Home":
      if (opPhase === "done") go(0);
      break;
    case "End":
      if (opPhase === "done") go(D.slides.length - 1);
      break;
    case "b":
    case "B":
    case ".":
      black.classList.toggle("on");
      break;
    case "f":
    case "F":
      if (document.fullscreenElement) document.exitFullscreen?.();
      else document.documentElement.requestFullscreen?.().catch(() => {});
      break;
    case "n":
    case "N":
      hud.classList.toggle("on");
      drawHud();
      break;
    case "s":
    case "S":
      if (opPhase !== "done") finishOpening();
      break;
    case "v":
    case "V":
      hideOverlay();
      break;
    case "t":
    case "T":
      timer0 = performance.now();
      drawHud();
      break;
    case "?":
      hud.classList.add("on");
      hud.textContent =
        "→ ↓ PageDown 엔터: 다음 (오프닝 중이면 건너뛰기)\n← ↑ PageUp: 이전 (이 장 처음 → 앞 장)\n스페이스: 영상 일시정지/재생 (영상이 없으면 다음)\n" +
        "숫자 1~9, 0: 그 장으로 · Home/End: 처음/끝\nS: 오프닝 바로 끝내기 · V: 띄운 영상 내리기\nB 또는 .: 검은 화면 · F: 전체 화면 · N: 발표자 창 · T: 시계 다시";
      break;
    default:
      if (/^[0-9]$/.test(k) && opPhase === "done") {
        const n = k === "0" ? 10 : Number(k);
        if (n <= D.slides.length) go(n - 1);
      }
  }
  updateCtrl();
});

// 점검용 (개발자 도구 콘솔에서 __deck.phase로 지금 단계를 본다)
window.__deck = {
  get phase() {
    return opPhase;
  },
  get slide() {
    return si + 1;
  },
  get beat() {
    return bi;
  },
};

/* ---------- 미리보기 주소 ----------
   ?slide=4&beat=1   오프닝 없이 그 장, 그 클릭까지
   ?op=stage|elly    오프닝의 한 장면에서 멈춘 화면 (자리 맞추기 확인용, 소리 없음) */
if (params.has("slide")) {
  started = true;
  startEl.classList.add("gone");
  opPhase = "done";
  opEl.hidden = true;
  go((Number(params.get("slide")) || 1) - 1);
  const k = Math.min(Number(params.get("beat")) || 0, (D.slides[si].beats || []).length);
  for (let j = 0; j < k; j++) run(D.slides[si].beats[bi++]);
} else if (params.has("op")) {
  started = true;
  startEl.classList.add("gone");
  opPhase = "talk";
  opStage.classList.add("on");
  if (params.get("op") === "elly") {
    opStageShadow.classList.add("on");
    opEllyBox.classList.add("on");
  }
}

})();
</script>

</body>
</html>
